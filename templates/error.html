{% extends "base.html" %}

{% block title %}Error {{ code }} — APK Sentinel{% endblock %}

{% block content %}
<section class="error-section">
    <h1 class="error-code">{{ code }}</h1>
    <p class="error-message">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="btn-primary" style="display: inline-block; text-decoration: none;">
        Back to Home
    </a>
</section>
{% endblock %}
